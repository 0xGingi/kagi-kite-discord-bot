services:
  kagi-kite-bot:
    build: .
    container_name: kagi-kite-discord-bot
    restart: unless-stopped
    volumes:
      - ./config.json:/usr/src/app/config.json:ro
      - ./data:/usr/src/app/data
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "bun", "run", "-e", "console.log('Health check')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge